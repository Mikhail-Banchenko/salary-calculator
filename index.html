<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор зарплаты</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --text: #1d2330; --muted: #667085;
    --line: #dde2ea; --accent: #2f6fde; --accent-text: #ffffff; --bad: #c2410c; --good: #15803d;
    --filled: #e6efff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151b; --card: #1b2029; --text: #e7eaf0; --muted: #98a2b3;
      --line: #2c3340; --accent: #5b8ff0; --accent-text: #0b0e13; --bad: #fb923c; --good: #4ade80;
      --filled: #1f2c45; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  .hint { color: var(--muted); font-size: .85rem; font-weight: 400; }
  input[type=number], select { width: 100%; padding: 10px 12px; font: inherit; border: 1px solid var(--line);
    border-radius: 8px; background: var(--bg); color: var(--text); }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .field { margin-bottom: 14px; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  .row > * { flex: 1; }
  button { font: inherit; border-radius: 8px; cursor: pointer; }
  .go { width: 100%; padding: 14px; border: 0; background: var(--accent); color: var(--accent-text); font-weight: 700; font-size: 1.05rem; }
  .radio { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; margin: 6px 0; }
  .err { color: var(--bad); margin: 8px 0 0; min-height: 1.2em; }

  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .wd { text-align: center; font-size: .75rem; color: var(--muted); padding-bottom: 2px; }
  .d { min-height: 58px; padding: 4px 2px; border: 1px solid var(--line); background: var(--card); color: var(--text);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; line-height: 1.2; }
  .d .num { font-weight: 600; font-size: .9rem; }
  .d .g { font-size: .72rem; color: var(--accent); font-weight: 700; margin-top: 3px; word-break: break-all; }
  .d .o { font-size: .68rem; color: var(--muted); }
  .d.has { background: var(--filled); border-color: var(--accent); }
  .d.off { visibility: hidden; }
  .totals { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; font-size: .9rem; color: var(--muted); }
  .totals b { color: var(--text); }

  dialog { border: 0; border-radius: 14px; padding: 20px; width: min(360px, calc(100vw - 32px));
    background: var(--card); color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h3 { margin: 0 0 14px; }
  .btns { display: flex; gap: 8px; margin-top: 6px; }
  .btns button { flex: 1; padding: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .btns .save { background: var(--accent); color: var(--accent-text); border: 0; font-weight: 700; }
  .btns .clear { color: var(--bad); }

  .big { text-align: center; padding: 8px 0 16px; }
  .big .n { font-size: 2.4rem; font-weight: 800; color: var(--good); }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 8px 0; border-bottom: 1px solid var(--line); }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  tr.total td { border-bottom: 0; font-size: 1.1rem; }
  .steps { color: var(--muted); font-size: .9rem; margin-top: 12px; }
  #result { display: none; }
</style>
</head>
<body>
<main>
  <h1>Калькулятор зарплаты</h1>
  <p class="sub">Выберите месяц, нажмите на день и введите выручку и операции по карте. Ничего не сохраняется.</p>

  <div class="card">
    <div class="row">
      <select id="month" aria-label="Месяц"></select>
      <input id="year" type="number" min="2000" max="2100" step="1" inputmode="numeric" aria-label="Год">
    </div>
    <div class="cal" id="cal"></div>
    <div class="totals">
      <span>Выручка: <b id="tGain">0.00</b></span>
      <span>Операций: <b id="tOps">0</b></span>
      <span>Дней: <b id="tDays">0</b></span>
    </div>
  </div>

  <div class="card">
    <div class="field">
      <label for="pct">Процент работника <span class="hint">(%)</span></label>
      <input id="pct" type="number" min="0" max="100" step="any" inputmode="decimal" placeholder="например, 30">
    </div>
    <div class="field">
      <label for="spend">Расходы на работе <span class="hint">(руб., например газировка)</span></label>
      <input id="spend" type="number" min="0" step="any" inputmode="decimal" placeholder="0">
    </div>
    <div class="field" style="margin-bottom:0">
      <label>Расходы вычитаются из</label>
      <label class="radio"><input type="radio" name="mode" value="gain"> выручки, до процента</label>
      <label class="radio"><input type="radio" name="mode" value="salary" checked> зарплаты работника, после процента</label>
    </div>
  </div>

  <button class="go" id="calc" type="button">Рассчитать</button>
  <p class="err" id="err"></p>

  <div class="card" id="result">
    <div class="big"><div class="hint">Зарплата</div><div class="n" id="salary"></div></div>
    <table id="stats"></table>
    <div class="steps" id="steps"></div>
  </div>
</main>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h3 id="dlgTitle"></h3>
    <div class="field">
      <label for="dGain">Выручка за день <span class="hint">(руб.)</span></label>
      <input id="dGain" type="number" min="0" step="any" inputmode="decimal" placeholder="0">
    </div>
    <div class="field">
      <label for="dOps">Операции по карте <span class="hint">(0,5 руб. за каждую)</span></label>
      <input id="dOps" type="number" min="0" step="1" inputmode="numeric" placeholder="0">
    </div>
    <p class="err" id="dErr"></p>
    <div class="btns">
      <button type="button" class="clear" id="dClear">Очистить</button>
      <button type="button" id="dCancel">Отмена</button>
      <button type="submit" class="save" id="dSave">Сохранить</button>
    </div>
  </form>
</dialog>

<script>
  var CARD_FEE = 0.5; // руб. за одну операцию по карте
  var MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  var MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  var WEEK = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

  var data = {};      // "ГГГГ-ММ-ДД" -> { gain, ops }
  var openKey = null;

  var $ = function (id) { return document.getElementById(id); };
  var monthSel = $('month'), yearIn = $('year'), cal = $('cal'), dlg = $('dlg');

  MONTHS.forEach(function (m, i) {
    var o = document.createElement('option'); o.value = i; o.textContent = m; monthSel.appendChild(o);
  });
  var now = new Date();
  monthSel.value = now.getMonth();
  yearIn.value = now.getFullYear();

  function ym() {
    var y = parseInt(yearIn.value, 10);
    return { y: isNaN(y) ? now.getFullYear() : y, m: Number(monthSel.value) };
  }
  function key(y, m, d) { return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0'); }
  function money(n) { return n.toFixed(2) + ' руб.'; }

  function monthEntries() {
    var t = ym(), n = new Date(t.y, t.m + 1, 0).getDate(), list = [];
    for (var d = 1; d <= n; d++) { var e = data[key(t.y, t.m, d)]; if (e) list.push(e); }
    return list;
  }

  function render() {
    var t = ym();
    var first = (new Date(t.y, t.m, 1).getDay() + 6) % 7; // понедельник = 0
    var n = new Date(t.y, t.m + 1, 0).getDate();
    var html = WEEK.map(function (w) { return '<div class="wd">' + w + '</div>'; }).join('');
    for (var i = 0; i < first; i++) html += '<div class="d off"></div>';
    for (var d = 1; d <= n; d++) {
      var e = data[key(t.y, t.m, d)];
      html += '<button type="button" class="d' + (e ? ' has' : '') + '" data-day="' + d + '">' +
        '<span class="num">' + d + '</span>' +
        (e ? '<span class="g">' + fmt(e.gain) + '</span><span class="o">' + e.ops + ' оп.</span>' : '') +
        '</button>';
    }
    cal.innerHTML = html;

    var list = monthEntries();
    $('tGain').textContent = list.reduce(function (a, e) { return a + e.gain; }, 0).toFixed(2);
    $('tOps').textContent = list.reduce(function (a, e) { return a + e.ops; }, 0);
    $('tDays').textContent = list.length;
  }
  function fmt(n) { return Number.isInteger(n) ? String(n) : n.toFixed(2); }

  cal.addEventListener('click', function (ev) {
    var b = ev.target.closest('.d[data-day]');
    if (!b) return;
    var t = ym(), d = Number(b.dataset.day);
    openKey = key(t.y, t.m, d);
    var e = data[openKey];
    $('dlgTitle').textContent = d + ' ' + MONTHS_GEN[t.m] + ' ' + t.y;
    $('dGain').value = e ? e.gain : '';
    $('dOps').value = e ? e.ops : '';
    $('dErr').textContent = '';
    dlg.showModal();
    $('dGain').focus();
  });

  $('dlgForm').addEventListener('submit', function (ev) {
    var g = $('dGain').value, o = $('dOps').value;
    var gain = g === '' ? 0 : Number(g), ops = o === '' ? 0 : Number(o);
    if (isNaN(gain) || isNaN(ops) || gain < 0 || ops < 0) {
      ev.preventDefault(); $('dErr').textContent = 'Числа не могут быть отрицательными.'; return;
    }
    if (ops !== Math.floor(ops)) {
      ev.preventDefault(); $('dErr').textContent = 'Количество операций должно быть целым числом.'; return;
    }
    if (g === '' && o === '') delete data[openKey];
    else data[openKey] = { gain: gain, ops: ops };
    render();
  });
  $('dClear').onclick = function () { delete data[openKey]; dlg.close(); render(); };
  $('dCancel').onclick = function () { dlg.close(); };
  dlg.addEventListener('click', function (ev) { if (ev.target === dlg) dlg.close(); }); // нажатие на фон

  monthSel.onchange = render;
  yearIn.oninput = render;

  function calculate() {
    var err = $('err');
    err.textContent = '';

    var list = monthEntries();
    var pctRaw = $('pct').value, pct = pctRaw === '' ? 0 : Number(pctRaw);
    var spendRaw = $('spend').value, spend = spendRaw === '' ? 0 : Number(spendRaw);
    var mode = document.querySelector('input[name=mode]:checked').value;

    if (list.length === 0) { err.textContent = 'Нажмите на день в календаре и введите выручку.'; return; }
    if (pctRaw === '') { err.textContent = 'Введите процент работника.'; return; }
    if (isNaN(spend) || spend < 0) { err.textContent = 'Числа не могут быть отрицательными.'; return; }
    if (isNaN(pct) || pct < 0 || pct > 100) { err.textContent = 'Процент должен быть от 0 до 100.'; return; }

    var totalGain = list.reduce(function (a, e) { return a + e.gain; }, 0);
    var ops = list.reduce(function (a, e) { return a + e.ops; }, 0);
    var avg = totalGain / list.length;
    var fees = ops * CARD_FEE;
    var afterFees = totalGain - fees;
    var p = pct / 100;
    var base, salary, company;

    if (mode === 'gain') {
      base = afterFees - spend;
      salary = base * p;
      company = base - salary;
    } else {
      base = afterFees;
      salary = base * p - spend;
      company = base - base * p;
    }

    var rows = [
      ['Рабочих дней', String(list.length)],
      ['Общая выручка', money(totalGain)],
      ['Средняя выручка в день', money(avg)],
      ['Операции по карте', String(ops)],
      ['Комиссия за карты', money(fees)],
      ['Расходы на работе', money(spend)],
      ['Забрала компания', money(company)]
    ];
    var html = rows.map(function (r) { return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>'; }).join('');
    html += '<tr class="total"><td><b>Зарплата</b></td><td>' + money(salary) + '</td></tr>';
    $('stats').innerHTML = html;
    $('salary').textContent = money(salary);

    var f = function (n) { return n.toFixed(2); };
    $('steps').textContent = mode === 'gain'
      ? 'Расчёт: (' + f(totalGain) + ' − ' + f(fees) + ' комиссия − ' + f(spend) + ' расходы) × ' + pct + '% = ' + f(salary) + ' руб.'
      : 'Расчёт: (' + f(totalGain) + ' − ' + f(fees) + ' комиссия) × ' + pct + '% − ' + f(spend) + ' расходы = ' + f(salary) + ' руб.';

    var res = $('result');
    res.style.display = 'block';
    res.scrollIntoView({ behavior: 'smooth' });
  }

  $('calc').onclick = calculate;
  render();
</script>
</body>
</html>
